; PlatformIO configuration for the CH32V003 LED library demo.
; The example is built from the repository ROOT:
;   pio run / pio run -t upload / pio device monitor
;
; Library: include/led.h + src/led.c (see library.json).
; It is attached as a dependency of the project itself via symlink,
; so examples/test_ch32v003/src contains NO copies of the library.
;
; Hardware: CH32V003F4P6 (RISC-V 48MHz, 20-pin)
; LEDs: PC4 (LED0), PC5 (LED1), PC6 (LED2), PC7 (LED3)
; Active level: HIGH

[platformio]
src_dir = examples/test_ch32v003/src
default_envs = ch32v003

[env:ch32v003]
platform = ch32v
board = genericCH32V003F4P6
framework = noneos-sdk
monitor_speed = 115200
build_flags = -std=c99
lib_deps = symlink://.

; ─────────────────────────────────────────────────────────────────────
;  Хост-тесты (без железа):  pio test -e native
;  Тестовый раннер самодостаточный (framework = custom), любой gcc.
; ─────────────────────────────────────────────────────────────────────
[env:native]
platform = native
test_framework = custom
build_flags = -std=c99 -Wall -Wextra -Wconversion -Wpedantic
lib_deps = symlink://.
