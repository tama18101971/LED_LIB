; PlatformIO configuration for the CH32V003 LED library examples.
; Examples are built from the repository ROOT:
;   pio run                                  # все примеры
;   pio run -e ch32v003                      # демо (мигание + SOS + эффект + маяк)
;   pio run -e ch32v003-rates                # четыре частоты, скважность 50 %
;   pio run -t upload -e ch32v003-rates      # прошивка выбранного окружения
;   pio device monitor                       # монитор порта (115200)
;
; Library: include/led.h + src/led.c (see library.json).
; It is attached as a dependency of the project itself via symlink,
; so examples/*/src contains NO copies of the library.
;
; Hardware: CH32V003F4P6 (RISC-V 48MHz, 20-pin)
; LEDs: PC4 (LED0), PC5 (LED1), PC6 (LED2), PC7 (LED3)
; Active level: HIGH
;
; Examples share one src_dir (examples/), so each env picks its own
; example with build_src_filter. src_dir is a project-level option and
; cannot be set per env.

[platformio]
src_dir = examples
default_envs = ch32v003, ch32v003-rates

; ─────────────────────────────────────────────────────────────────────
;  Демо: мигание + SOS + глобальный эффект + маяк из упакованных команд
; ─────────────────────────────────────────────────────────────────────
[env:ch32v003]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4P6
framework = noneos-sdk
monitor_speed = 115200
build_flags = -std=c99
build_src_filter = +<test_ch32v003/src/> -<rates_ch32v003/>
lib_deps = symlink://.

; ─────────────────────────────────────────────────────────────────────
;  Пример: четыре диода с разными частотами, скважность 50 %
;  (LED0 1/4 с, LED1 1/2 с, LED2 1/1 с, LED3 2/1 с)
; ─────────────────────────────────────────────────────────────────────
[env:ch32v003-rates]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4P6
framework = noneos-sdk
build_flags = -std=c99
build_src_filter = +<rates_ch32v003/src/> -<test_ch32v003/>
lib_deps = symlink://.

; ─────────────────────────────────────────────────────────────────────
;  Хост-тесты (без железа):  pio test -e native
;  Тестовый раннер самодостаточный (framework = custom), любой gcc.
;  Собирается test/ + библиотека из lib_deps, src_dir здесь не участвует.
; ─────────────────────────────────────────────────────────────────────
[env:native]
platform = native
test_framework = custom
build_flags = -std=c99 -Wall -Wextra -Wconversion -Wpedantic
lib_deps = symlink://.
