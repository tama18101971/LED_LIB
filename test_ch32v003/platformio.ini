; PlatformIO configuration for CH32V003 LED library demo
;
; Hardware: CH32V003F4P6 (RISC-V 48MHz, 20-pin)
; LEDs: PC4 (LED0), PC5 (LED1), PC6 (LED2), PC7 (LED3)
; Active level: HIGH

[env:ch32v003]
platform = ch32v
board = genericCH32V003F4P6
framework = noneos-sdk
monitor_speed = 115200
build_flags = -std=c99
