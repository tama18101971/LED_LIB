# LED_LIB CI: host tests across configurations + firmware build.
#
# Host tests: pure C99, self-contained runner (test/test_led_lib), any gcc.
# Firmware: PlatformIO build of the CH32V003 demo from the repo root
# (CH32V platform is community-maintained, installed from GitHub).
# The native env exists only for `pio test -e native` (custom runner);
# its own sources are the test suite, so it is not built by `pio run`.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: ''
            name: default
          - config: '-DLED_COUNT=1'
            name: led1
          - config: '-DLED_COUNT=2'
            name: led2
          - config: '-DLED_COUNT=3'
            name: led3
          - config: '-DLED_COUNT=5'
            name: led5
          - config: '-DLED_COUNT=8'
            name: led8
          - config: '-DLED_USE_EFFECTS=0'
            name: no-effects
          - config: '-DLED_USE_SEQUENCES=0'
            name: no-sequences
          - config: '-DLED_USE_EFFECTS=0 -DLED_USE_SEQUENCES=0'
            name: minimal
          - config: '-DLED_USE_RUNNING_EFFECTS=0'
            name: no-running
          - config: '-DLED_USE_PINGPONG_EFFECT=0'
            name: no-pingpong
          - config: '-DLED_USE_BLINK_EFFECTS=0'
            name: no-blink-fx
          - config: '-DLED_USE_MULTI_BLINK_EFFECTS=0'
            name: no-multi-blink
          - config: '-DLED_USE_RANDOM_EFFECT=0'
            name: no-random
          - config: '-DLED_USE_HOLD_EFFECTS=0'
            name: no-hold
          - config: '-DLED_COUNT=8 -DLED_USE_SEQUENCES=0 -DLED_USE_RUNNING_EFFECTS=0'
            name: led8-trimmed
    steps:
      - uses: actions/checkout@v4

      - name: Build and run tests (-Werror)
        run: >
          gcc -std=c99 -Wall -Wextra -Wconversion -Wpedantic -Werror
          ${{ matrix.config }}
          -Iinclude test/test_led_lib/test_led_lib.c src/led.c -o test_bin
          && ./test_bin

      - name: Library compiles with -pedantic-errors -Werror
        run: >
          gcc -std=c99 -pedantic-errors -Wall -Wextra -Werror
          ${{ matrix.config }}
          -Iinclude -c src/led.c -o /dev/null

  firmware:
    name: Firmware build (ch32v003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: pio-ch32v003-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-ch32v003-
      - name: Build
        run: pio run -e ch32v003

  native-pio:
    name: pio test -e native (custom runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Run tests via custom runner
        run: pio test -e native
